plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ajju.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ajju.ai'
        minSdk 23
        targetSdk 32
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
